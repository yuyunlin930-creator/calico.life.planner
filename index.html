<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三花人生規劃</title>
<style>
:root{--bg:#f7f4ec;--paper:#fffdf8;--ink:#2e2b26;--muted:#8a8478;--line:#ece6d6;--border:#e2dccb;--accent:#e48a45;--accent-ink:#fff;--soft:#f6e9d9;--danger:#cf4b3f;--ok:#4f9a64;--h0:#ece7da;--h1:#f7dcc0;--h2:#f1b985;--h3:#e58f4b;--h4:#c76a24;
--hand:"Segoe Print","Bradley Hand","Marker Felt","Noto Sans TC","PingFang TC","Microsoft JhengHei",cursive;
--sans:-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
[data-theme=dark]{--bg:#1c1b19;--paper:#262522;--ink:#ece7dc;--muted:#9b9486;--line:#242321;--border:#3a3732;--accent:#eb9a55;--accent-ink:#1c1b19;--soft:#3a3025;--danger:#e8695d;--ok:#6cb883;--h0:#34322e;--h1:#5a4630;--h2:#85582c;--h3:#b8742f;--h4:#eba150}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background-color:var(--bg);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 28px;line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:8px 10px;max-width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h2,h3{margin:0 0 10px;font-weight:600}
.hand{font-family:var(--hand)}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;background:var(--paper);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.brand{font-size:20px;white-space:nowrap}
.top nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.top nav button{background:none;border:0;padding:8px 14px;border-radius:999px;color:var(--muted)}
.top nav button.on{background:var(--soft);color:var(--ink);font-weight:600}
.quick{display:flex;align-items:center;gap:8px}
.coin{font-weight:600;padding:4px 10px;background:var(--soft);border-radius:999px}
.icon{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:6px 10px;min-width:38px}
main{max-width:1100px;margin:0 auto;padding:20px}
.card{background:var(--paper);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px}
.home{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.home aside .card:last-child{margin-bottom:16px}
@media(max-width:820px){.home{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 16px;font-weight:600}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--border);font-weight:400}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--danger)}
.btn.sm{padding:5px 11px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px}
.seg button.on{background:var(--soft);font-weight:600}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.muted{color:var(--muted)}
small{color:var(--muted)}
.hm{width:100%;height:auto;display:block;margin:6px 0}
.hm text{fill:var(--muted);font-size:10px;font-family:var(--sans)}
.hm rect{cursor:pointer}
.hm rect.today{stroke:var(--ink);stroke-width:1.5}
.h0{fill:var(--h0)}.h1{fill:var(--h1)}.h2{fill:var(--h2)}.h3{fill:var(--h3)}.h4{fill:var(--h4)}
.legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);justify-content:flex-end}
.legend i{width:13px;height:13px;border-radius:3px;display:inline-block}
.legend i.h0{background:var(--h0)}.legend i.h1{background:var(--h1)}.legend i.h2{background:var(--h2)}.legend i.h3{background:var(--h3)}.legend i.h4{background:var(--h4)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stats3>div,.tile{background:var(--bg);border-radius:12px;padding:10px 12px;text-align:center}
.stats3 b,.tile b{display:block;font-size:24px;font-family:var(--hand)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:700px){.tiles{grid-template-columns:repeat(2,1fr)}}
.bar{height:10px;background:var(--h0);border-radius:999px;overflow:hidden;flex:1;min-width:60px}
.bar>i{display:block;height:100%;background:var(--dc,var(--accent));border-radius:999px;transition:width .3s}
.bar.low>i{background:var(--danger)}
.pet{text-align:center;position:relative}
.bubble{display:inline-block;background:var(--bg);border:1px solid var(--border);padding:6px 14px;border-radius:14px;font-size:14px;margin-bottom:6px;max-width:100%}
.catwrap{cursor:pointer;margin:0 auto;max-width:260px;user-select:none;-webkit-tap-highlight-color:transparent}
.pet.big .catwrap{max-width:340px}
.cat{width:100%;height:auto;display:block;overflow:visible}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4s ease-in-out infinite}
.catwrap.sleep .breathe{animation-duration:6s}
.tail{transform-box:fill-box;transform-origin:0 100%;animation:wag 5s ease-in-out infinite}
.catwrap.bounce{animation:bounce .6s}
.zz{font-size:18px;fill:var(--muted);animation:zz 3s ease-in-out infinite}
.qmark{animation:zz 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.015,.985)}}
@keyframes wag{50%{transform:rotate(6deg)}}
@keyframes zz{50%{transform:translateY(-6px);opacity:.5}}
@keyframes bounce{30%{transform:translateY(-14px) scale(1.03)}60%{transform:translateY(0) scale(.98,1.02)}}
.pname{margin:4px 0 8px;font-size:18px}
.meter{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px;text-align:left}
.meter span:first-child{width:62px;flex:none;color:var(--muted)}
.meter span:last-child{min-width:64px;text-align:right}
.q{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border)}
.q:last-of-type{border-bottom:0}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);background:var(--paper);flex:none;padding:0;display:grid;place-items:center;font-size:14px;line-height:1;color:transparent}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.q.done .qt,.task.done .qt{text-decoration:line-through;color:var(--muted)}
.qt{flex:1;min-width:0;word-break:break-word}
.domhead{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.domhead h3{margin:0;font-size:18px}
.goal{background:var(--paper);border:1px solid var(--border);border-left:5px solid var(--dc);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.ghead{cursor:pointer}
.gtitle{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600}
.gprog{display:flex;align-items:center;gap:10px;margin-top:8px}
.gprog b{width:44px;text-align:right}
.gbody{margin-top:12px;border-top:1px dashed var(--border);padding-top:12px}
.task{display:flex;align-items:center;gap:10px;padding:6px 0}
.due{font-size:12px;color:var(--muted);white-space:nowrap}
.due.soon{color:#c58a1d}.due.late{color:var(--danger);font-weight:600}
.x{background:none;border:0;color:var(--muted);padding:2px 8px;font-size:18px}
.inl{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.inl input[type=text]{flex:1;min-width:140px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:var(--bg);border-radius:14px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.item .em{font-size:34px}
.item.lock{opacity:.55}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ach div{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px}
.ach div.off{opacity:.4;filter:grayscale(1)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--sans)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.banner{background:var(--soft);border-radius:14px;padding:14px 18px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{background:var(--paper);border-radius:18px;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow:auto;border:1px solid var(--border)}
.modal label{display:block;margin:10px 0 4px;font-size:13px;color:var(--muted)}
.modal input,.modal select,.modal textarea{width:100%}
.modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.hide{display:none!important}
.drow{display:grid;grid-template-columns:56px 1fr 52px auto auto;gap:6px;align-items:center;margin-bottom:8px}
.drow input[type=color]{padding:2px;height:36px;width:52px}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:70;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.conf{position:fixed;top:-30px;font-size:22px;pointer-events:none;animation:fall 2.2s ease-in forwards;z-index:60}
@keyframes fall{to{transform:translate(var(--dx),108vh) rotate(360deg);opacity:.8}}
.tm{text-align:center}.tm.run{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.tclock{font-family:var(--hand);font-size:clamp(46px,9vw,84px);font-weight:600;letter-spacing:2px;margin:6px 0;font-variant-numeric:tabular-nums;line-height:1.1}
.btn.big{padding:13px 26px;font-size:18px;border-radius:14px}
@media(max-width:900px){.top{gap:8px;padding:10px 14px}.top nav{gap:0}.top nav button{padding:8px 9px;font-size:14px}.brand{font-size:17px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:560px){main{padding:12px}.top{padding:10px 12px}.top nav button span{display:none}.drow{grid-template-columns:48px 1fr 48px auto}.drow .btn.danger{grid-column:1/-1}}
</style>
</head>

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const [a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const todayStr=()=>ymd(new Date());
const pick=a=>a[Math.floor(Math.random()*a.length)];
const KEY='calico-life-planner-v1';
const DOMS=[['health','💪','#5b9a6f'],['career','💼','#4f7fb8'],['money','💰','#d4a22f'],['learn','📚','#e48a45'],['social','🤝','#c96b8a'],['hobby','🎨','#8a6fc0'],['mind','🧘','#4aa3a2']];
const FOODS=[{id:'kibble',icon:'🥣',cost:10,gain:15},{id:'fish',icon:'🐟',cost:30,gain:45},{id:'can',icon:'🥫',cost:60,gain:100}];
const DECOR=[{id:'yarn',icon:'🧶',cost:40,lvl:2},{id:'scratch',icon:'🪵',cost:80,lvl:3},{id:'mat',icon:'🛏️',cost:60,lvl:4},{id:'bed',icon:'🧺',cost:120,lvl:5},{id:'box',icon:'📦',cost:100,lvl:6},{id:'bucket',icon:'🧊',cost:90,lvl:7},{id:'plant',icon:'🪴',cost:80,lvl:8},{id:'house',icon:'🏠',cost:200,lvl:10}];
const HZ=['life','year','month','week'];
const RATE=100/120;            // fullness per hour (empty in 5 days)
const GRACE_H=48;              // grace period in hours

/* ============ state ============ */
function newPet(z){return{name:z?'花花':'Mochi',xp:0,coins:0,fullness:80,lastTick:Date.now(),grace:null,away:false,awayTasks:0,owned:[],equipped:[]}}
function defaultState(){
  const lang=(navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en',z=lang==='zh';
  return{v:1,settings:{lang,theme:'auto',keepAwake:false},timer:{state:'idle',since:0,acc:0,subj:''},
    domains:DOMS.map(([k,i,c])=>({id:'dom_'+k,key:k,icon:i,color:c})),
    goals:[],tasks:[],logs:{},
    rewards:[{id:uid(),name:z?'喝一杯手搖飲':'Bubble tea',cost:80,icon:'🧋'},{id:uid(),name:z?'看一集喜歡的影集':'Watch an episode',cost:50,icon:'📺'}],
    claims:[],pet:newPet(z),ach:{},daily:{date:'',ids:[],bonus:false},
    stats:{fed:0,rescued:0,questDays:0,valDay:'',valCnt:0}};
}
function migrate(o){
  const d=defaultState(),r={...d,...o};
  r.settings={...d.settings,...(o.settings||{})};
  r.pet={...d.pet,...(o.pet||{})};
  r.timer={...d.timer,...(o.timer||{})};
  r.stats={...d.stats,...(o.stats||{})};
  r.daily=o.daily||d.daily;
  for(const k of ['domains','goals','tasks','rewards','claims'])if(!Array.isArray(r[k]))r[k]=d[k];
  if(!r.logs||typeof r.logs!=='object')r.logs={};
  if(!r.ach||typeof r.ach!=='object')r.ach={};
  r.v=1;return r;
}
let S=(()=>{try{const r=localStorage.getItem(KEY);if(r)return migrate(JSON.parse(r))}catch(e){}return defaultState()})();
let saveFailed=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));saveFailed=false}catch(e){if(!saveFailed)toast(t('saveErr'));saveFailed=true}}
const ui={view:'home',hm:'min',filter:'all',chart:'week',open:{}};

const t=(k,p)=>{let s=(I18N[S.settings.lang]||I18N.zh)[k];if(s==null)s=I18N.zh[k]??k;if(p)for(const q in p)s=s.split('{'+q+'}').join(p[q]);return s};
const loc=()=>S.settings.lang==='zh'?'zh-TW':'en-US';
const dname=d=>d.name||(d.key?t('dom.'+d.key):'?');

/* ============ toast / fx ============ */
let toastT;
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2600)}
function burst(em=['🎉','✨','🐟','⭐','💛']){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  for(let i=0;i<22;i++){const s=document.createElement('span');s.className='conf';s.textContent=em[i%em.length];s.style.left=(8+Math.random()*84)+'vw';s.style.setProperty('--dx',(Math.random()*120-60)+'px');s.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2700)}
}

/* ============ game logic ============ */
const level=xp=>Math.floor(Math.sqrt(Math.max(0,xp)/40))+1;
const xpFor=l=>40*(l-1)*(l-1);
function award(xp,coins){
  const p=S.pet,b=level(p.xp);p.xp+=xp;p.coins+=coins;const a=level(p.xp);
  if(a>b){const u=DECOR.filter(d=>d.lvl>b&&d.lvl<=a).map(d=>t('decor.'+d.id)).join('、');toast(t('lvup',{n:a})+(u?t('unlock',{x:u}):''));burst()}
}
function tick(){
  const p=S.pet,now=Date.now();
  if(p.away){p.lastTick=now;return}
  const hrs=Math.max(0,(now-p.lastTick)/36e5);
  if(p.grace==null){
    const need=p.fullness/RATE;
    if(hrs<need)p.fullness-=hrs*RATE;
    else{p.fullness=0;p.grace=p.lastTick+need*36e5}
  }
  p.lastTick=now;
  if(p.grace!=null&&now-p.grace>=GRACE_H*36e5){p.away=true;p.awayTasks=0;p.grace=null}
}
function mood(){
  const p=S.pet;if(p.away)return'away';if(p.grace!=null)return'sad';if(p.fullness<30)return'hungry';
  const h=new Date().getHours();if(h>=23||h<7)return'sleep';return p.fullness>=60?'happy':'idle';
}
function prog(g){
  if(g.mode==='tasks'){const ts=S.tasks.filter(x=>x.goalId===g.id);return ts.length?Math.round(ts.filter(x=>x.done).length/ts.length*100):0}
  if(g.mode==='value')return g.target>0?Math.max(0,Math.min(100,Math.round(g.current/g.target*100))):0;
  return Math.max(0,Math.min(100,Math.round(+g.manual||0)));
}
function progText(g){
  if(g.mode==='tasks'){const ts=S.tasks.filter(x=>x.goalId===g.id);return t('tasksOf',{a:ts.filter(x=>x.done).length,b:ts.length})}
  if(g.mode==='value')return fmt(g.current)+' / '+fmt(g.target)+' '+esc(g.unit||'');
  return t('manual');
}
function checkGoalDone(id){
  const g=S.goals.find(x=>x.id===id);if(!g)return;
  if(prog(g)>=100&&!g.rewarded){g.rewarded=true;award(30,20);toast(t('goalDone'));burst()}
}
function actMap(){
  const m={};
  for(const [d,l] of Object.entries(S.logs))if(l&&l.min>0)(m[d]=m[d]||{min:0,done:0}).min=l.min;
  for(const k of S.tasks)if(k.done&&k.doneDate)(m[k.doneDate]=m[k.doneDate]||{min:0,done:0}).done++;
  return m;
}
function streak(m){let d=new Date();if(!m[ymd(d)])d=addDays(d,-1);let n=0;while(m[ymd(d)]){n++;d=addDays(d,-1)}return n}
function bestStreak(m){
  const ks=Object.keys(m).sort();let best=0,cur=0,prev=null;
  for(const k of ks){cur=(prev&&ymd(addDays(parseD(prev),1))===k)?cur+1:1;best=Math.max(best,cur);prev=k}
  return best;
}
function ensureDaily(){
  const td=todayStr();
  if(S.daily.date!==td)S.daily={date:td,ids:[],bonus:false};
  const d=S.daily;d.ids=d.ids.filter(id=>S.tasks.some(x=>x.id===id));
  if(d.ids.length<3){
    const rank=h=>HZ.length-HZ.indexOf(h);
    const cand=S.tasks.filter(x=>!x.done&&!d.ids.includes(x.id)&&S.goals.some(g=>g.id===x.goalId))
      .sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||rank(S.goals.find(g=>g.id===b.goalId).horizon)-rank(S.goals.find(g=>g.id===a.goalId).horizon)||(a.created||0)-(b.created||0));
    while(d.ids.length<3&&cand.length)d.ids.push(cand.shift().id);
  }
}
function dailyCheck(){
  const d=S.daily;
  if(d.ids.length&&!d.bonus&&d.ids.every(id=>{const k=S.tasks.find(x=>x.id===id);return k&&k.done})){
    d.bonus=true;S.stats.questDays++;award(20,15);toast(t('questDone'));burst();
  }
}
const ACHS={first:c=>c.done>=1,t10:c=>c.done>=10,t50:c=>c.done>=50,s3:c=>c.best>=3,s7:c=>c.best>=7,s30:c=>c.best>=30,h10:c=>c.min>=600,h100:c=>c.min>=6000,l5:c=>c.lv>=5,l10:c=>c.lv>=10,goal:c=>c.goals>=1,feed:c=>S.stats.fed>=1,rescue:c=>S.stats.rescued>=1,quest:c=>S.stats.questDays>=1};
function checkAch(){
  const m=actMap();
  const c={done:S.tasks.filter(x=>x.done).length,best:bestStreak(m),min:Object.values(S.logs).reduce((a,l)=>a+(+l.min||0),0),lv:level(S.pet.xp),goals:S.goals.filter(g=>g.rewarded).length};
  for(const k in ACHS)if(!S.ach[k]&&ACHS[k](c)){S.ach[k]=Date.now();toast('🏅 '+t('ach.'+k).split('|')[0]);burst(['🏅','✨'])}
}
function after(){dailyCheck();checkAch();save();render()}

/* ============ cat drawing (hand-drawn line-art style) ============ */
const CAT={D:'#2b2b2b',W:'#fffdf8',OR:'#eda766',BR:'#8a5530',BK:'#4a3426',TL:'#f3c995',TD:'#5e3d26',PK:'#f4b4b0'};
function bez(c,u){const m=1-u;return[0,1].map(i=>m*m*m*c[0][i]+3*m*m*u*c[1][i]+3*m*u*u*c[2][i]+u*u*u*c[3][i])}
function tailSVG(cs,wOut,wIn){
  const {D,TL,TD}=CAT,n=cs.length;
  const pt=u=>{const i=Math.min(n-1,Math.floor(u*n));return bez(cs[i],u*n-i)};
  const pathD=cs.map((c,i)=>(i?'':`M${c[0][0]} ${c[0][1]}`)+`C${c[1][0]} ${c[1][1]} ${c[2][0]} ${c[2][1]} ${c[3][0]} ${c[3][1]}`).join('');
  const seg=(a,b)=>{let d='';for(let i=0;i<=10;i++){const q=pt(a+(b-a)*i/10);d+=(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)}return d};
  let s=`<path d="${pathD}" fill="none" stroke="${D}" stroke-width="${wOut}" stroke-linecap="round"/><path d="${pathD}" fill="none" stroke="${TL}" stroke-width="${wIn}" stroke-linecap="round"/>`;
  for(const [a,b] of [[.2,.31],[.43,.54],[.66,.77]])s+=`<path d="${seg(a,b)}" fill="none" stroke="${TD}" stroke-width="${wIn}"/>`;
  s+=`<path d="${seg(.87,1)}" fill="none" stroke="${TD}" stroke-width="${wIn}" stroke-linecap="round"/>`;
  return s;
}

  e+=(m==='hungry'||m==='sad')?`<ellipse cx="0" cy="29" rx="3.6" ry="4.6" fill="#a04a4a" stroke="${D}" stroke-width="2"/>`:`<path d="M0 20q-5 7-10 2M0 20q5 7 10 2" ${thin}/>`;

/* ============ study timer (YPT style stopwatch) ============ */
const TMAX=12*3600e3;
function tmElapsed(now){now=now||Date.now();const T=S.timer;if(!T||T.state==='idle')return 0;return Math.min(TMAX,Math.max(0,(+T.acc||0)+(T.state==='run'?now-T.since:0)))}
const fmtHMS=ms=>{const s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
const fmtDur=min=>{min=Math.max(0,Math.floor(min));const h=Math.floor(min/60),m=min%60;return h?h+'h '+pad(m)+'m':m+'m'};
function subjName(id){if(!id)return t('tm.general');const g=S.goals.find(x=>x.id===id);return g?g.title:t('tm.deleted')}
function commitStudy(ms,subj){
  let rem=Math.min(ms,TMAX),cursor=Date.now(),total=0;
  while(rem>0){
    const d=new Date(cursor-1),ds=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
    const part=Math.min(rem,cursor-ds),date=ymd(d),m=Math.round(part/60000);
    if(m>0){const l=S.logs[date]||(S.logs[date]={min:0,note:''});l.min=(+l.min||0)+m;l.subj=l.subj||{};l.subj[subj||'']=(l.subj[subj||'']||0)+m;total+=m}
    rem-=part;cursor=ds;
  }
  if(total>0){const xp=Math.floor(total/10),c=Math.floor(total/15);award(xp,c);toast(t('tm.saved',{m:total,x:xp,c}))}
  else toast(t('tm.short'));
  return total;
}
function tmAct(a){
  const T=S.timer,now=Date.now();
  if(a==='tmStart'&&T.state==='idle')S.timer={state:'run',since:now,acc:0,subj:T.subj||''};
  else if(a==='tmPause'&&T.state==='run'){T.acc=tmElapsed(now);T.state='pause'}
  else if(a==='tmResume'&&T.state==='pause'){T.since=now;T.state='run'}
  else if(a==='tmStop'&&T.state!=='idle'){const ms=tmElapsed(now),sj=T.subj;S.timer={state:'idle',since:0,acc:0,subj:sj};commitStudy(ms,sj)}
  else if(a==='tmDiscard')S.timer={state:'idle',since:0,acc:0,subj:T.subj||''};
  after();
}
let wl=null,wlBusy=false;
async function syncWake(){
  if(wlBusy)return;wlBusy=true;
  try{
    const want=!!(S.settings.keepAwake&&S.timer.state==='run'&&!document.hidden&&navigator.wakeLock);
    if(want&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}
    else if(!want&&wl){const w=wl;wl=null;await w.release()}
  }catch(e){wl=null}
  wlBusy=false;
}
function tickTimer(){
  const T=S.timer,ms=tmElapsed(),on=T.state!=='idle',ic=T.state==='pause'?'⏸ ':'⏱ ';
  const big=$('#tbig');if(big)big.textContent=fmtHMS(ms);
  const chip=$('#tchip');if(chip)chip.textContent=ic+fmtHMS(ms);
  const td=$('#ttoday');if(td){const l=S.logs[todayStr()];td.textContent=fmtDur((l?+l.min||0:0)+ms/60000)}
  document.title=on?ic+fmtHMS(ms)+' · '+t('app'):t('app');
}

}

function dueInfo(due,done){
  if(!due)return'';
  if(done)return`<span class="due">📅 ${esc(due)}</span>`;
  const diff=Math.round((parseD(due)-parseD(todayStr()))/864e5);
  const cls=diff<0?'late':diff<=3?'soon':'';
  const txt=diff<0?t('overdue',{n:-diff}):diff===0?t('today'):t('daysLeft',{n:diff});
  return`<span class="due ${cls}">⏰ ${txt}</span>`;
}

function heatmap(){
  const wk=26,step=20,cell=16,left=26,top=18,today=new Date();
  const start=addDays(addDays(today,-today.getDay()),-(wk-1)*7);
  const W=left+wk*step,H=top+7*step,td=todayStr();
  let s=`<svg viewBox="0 0 ${W} ${H}" class="hm" role="img" aria-label="${t('hm.title')}">`;
  const wf=new Intl.DateTimeFormat(loc(),{weekday:'short'}),mf=new Intl.DateTimeFormat(loc(),{month:'short'});
  [1,3,5].forEach(r=>{s+=`<text x="0" y="${top+r*step+12}">${wf.format(addDays(start,r))}</text>`});
  let lm=-1;
  for(let c=0;c<wk;c++){const d0=addDays(start,c*7);if(d0.getMonth()!==lm){lm=d0.getMonth();s+=`<text x="${left+c*step}" y="11">${mf.format(d0)}</text>`}}
  for(let c=0;c<wk;c++)for(let r=0;r<7;r++){
    const d=addDays(start,c*7+r);if(d>today)continue;
    const k=ymd(d),a=ACT[k]||{min:0,done:0},lv=ui.hm==='min'?lvMin(a.min):lvTask(a.done);
    s+=`<rect class="h${lv}${k===td?' today':''}" x="${left+c*step}" y="${top+r*step}" width="${cell}" height="${cell}" rx="4" data-act="day" data-date="${k}"><title>${esc(t('hmTip',{d:k,m:a.min,k:a.done}))}</title></rect>`;
  }
  return s+'</svg>';
}

function niceMax(m){const mag=Math.pow(10,Math.floor(Math.log10(m))),n=m/mag;return(n<=1?1:n<=2?2:n<=5?5:10)*mag}
function lineChart(){
  const pts=[];
  if(ui.chart==='week'){
    const sun=addDays(new Date(),-new Date().getDay());
    for(let i=7;i>=0;i--){const s=addDays(sun,-7*i);let m=0;for(let j=0;j<7;j++){const a=ACT[ymd(addDays(s,j))];if(a)m+=a.min}pts.push({l:(s.getMonth()+1)+'/'+s.getDate(),v:m/60})}
  }else{
    const now=new Date();
    for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);let m=0;for(const k in ACT){const x=parseD(k);if(x.getFullYear()===d.getFullYear()&&x.getMonth()===d.getMonth())m+=ACT[k].min}pts.push({l:new Intl.DateTimeFormat(loc(),{month:'short'}).format(d),v:m/60})}
  }
  const W=600,H=260,pl=42,pr=16,pt=16,pb=34,max=niceMax(Math.max(...pts.map(p=>p.v),1));
  const X=i=>pl+i*(W-pl-pr)/(pts.length-1),Y=v=>pt+(H-pt-pb)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${t('ch.title')}">`;
  for(let i=0;i<=4;i++){const v=max*i/4,y=Y(v);s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 4"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${+v.toFixed(1)}</text>`}
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i)} ${Y(p.v)}`).join('');
  s+=`<path d="${line}L${X(pts.length-1)} ${Y(0)}L${X(0)} ${Y(0)}Z" fill="var(--accent)" opacity=".15"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(p.v)}" r="4.5" fill="var(--paper)" stroke="var(--accent)" stroke-width="2.5"><title>${p.l}: ${p.v.toFixed(1)} h</title></circle><text x="${X(i)}" y="${H-12}" text-anchor="middle">${p.l}</text>`});
  return s+'</svg>';
}
function radar(){
  const ds=S.domains.map(d=>{const gs=S.goals.filter(g=>g.domainId===d.id);return{d,v:gs.length?gs.reduce((a,g)=>a+prog(g),0)/gs.length:0}});
  if(ds.length<3)return`<p class="muted">${t('radar.need')}</p>`;
  const cx=210,cy=190,R=115,n=ds.length,pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
  let s=`<svg viewBox="0 0 420 380" class="chart" role="img" aria-label="${t('radar.title')}">`;
  [.25,.5,.75,1].forEach(f=>{s+=`<polygon points="${ds.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="var(--border)"/>`});
  ds.forEach((_,i)=>{const[x,y]=pt(i,R);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--border)"/>`});
  s+=`<polygon points="${ds.map((o,i)=>pt(i,Math.max(3,R*o.v/100)).join(',')).join(' ')}" fill="var(--accent)" fill-opacity=".28" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  ds.forEach((o,i)=>{const[x,y]=pt(i,R+24),[px,py]=pt(i,Math.max(3,R*o.v/100)),a=x<cx-8?'end':x>cx+8?'start':'middle';let nm=dname(o.d);if(nm.length>8)nm=nm.slice(0,7)+'…';s+=`<circle cx="${px}" cy="${py}" r="3.5" fill="var(--accent)"/><text x="${x}" y="${y+4}" text-anchor="${a}" style="font-size:12px;fill:var(--ink)">${esc(o.d.icon)} ${esc(nm)} ${Math.round(o.v)}%</text>`});
  return s+'</svg>';
}

  mk(dom('health'),s('每週運動 3 次','Exercise 3× a week'),'week',off(6-now.getDay()),'value',{target:3,current:1,unit:s('次','times')});
  mk(dom('money'),s('存到第一桶金','Save the first big chunk'),'life',off(900),'value',{target:1000000,current:235000,unit:'TWD'});
  mk(dom('career'),s('完成個人作品集','Finish my portfolio'),'month',off(20),'tasks',{},[[s('選出 5 個代表作','Pick 5 best projects'),1],[s('撰寫案例說明','Write case studies'),0,7],[s('設計版面','Design the layout'),0,14],[s('請朋友回饋','Ask friends for feedback'),0,18]]);
  mk(dom('hobby'),s('今年讀 12 本書','Read 12 books this year'),'year',eoy,'value',{target:12,current:4,unit:s('本','books')});
  mk(dom('social'),s('每月與家人聚餐','Family dinner every month'),'month',eom,'manual',{manual:50});
  mk(dom('mind'),s('21 天冥想挑戰','21-day meditation challenge'),'month',off(15),'value',{target:21,current:6,unit:s('天','days')});
  for(let i=1;i<=70;i++){
    const d=ymd(addDays(now,-i));if(S.logs[d])continue;
    const r=Math.abs(Math.sin(i*91.7)*1000)%1;
    if(r>.3)S.logs[d]={min:Math.round(r*8)*15,note:''};
  }
  toast(t('saved'));
}

/* ============ events ============ */
document.addEventListener('click',e=>{
  const sb=e.target.closest('button');
  if(sb&&!sb.dataset.act&&sb.type==='submit'&&sb.form&&sb.form.dataset.form){e.preventDefault();handleForm(sb.form);return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id,val=el.dataset.val;
  if(a==='overlay'){if(e.target===el)closeModal();return}
  switch(a){
    case'nav':ui.view=el.dataset.v;window.scrollTo(0,0);render();break;
    case'lang':case'setLang':S.settings.lang=a==='lang'?(S.settings.lang==='zh'?'en':'zh'):val;save();render();break;
    case'themeCycle':S.settings.theme={light:'dark',dark:'auto',auto:'light'}[S.settings.theme];save();render();break;
    case'setTheme':S.settings.theme=val;save();render();break;
    case'hm':ui.hm=val;render();break;
    case'chart':ui.chart=val;render();break;
    case'filter':ui.filter=val;render();break;
    case'day':dayModal(el.dataset.date);break;
    case'addMin':{const i=$('#dmin');if(i)i.value=Math.min(1440,(+i.value||0)+ +el.dataset.n);break}
    case'toggleGoal':ui.open[id]=!ui.open[id];render();break;
    case'toggleTask':{
      const k=S.tasks.find(x=>x.id===id);if(!k)break;
      k.done=!k.done;
      if(k.done){k.doneDate=todayStr();if(!k.rewarded){k.rewarded=true;award(10,5);if(S.pet.away)S.pet.awayTasks++;toast(t('taskDone'))}}else k.doneDate=null;
      checkGoalDone(k.goalId);after();break}
    case'delTask':S.tasks=S.tasks.filter(x=>x.id!==id);after();break;
    case'goalNew':goalModal();break;
    case'goalEdit':goalModal(id);break;
    case'goalDel':ask(t('confirmDel'),()=>{S.goals=S.goals.filter(x=>x.id!==id);S.tasks=S.tasks.filter(x=>x.goalId!==id);after()});break;
    case'domains':domainsModal();break;
    case'delDomain':
      if(S.goals.some(g=>g.domainId===id)){toast(t('dom.hasGoals'));break}
      ask(t('confirmDel'),()=>{S.domains=S.domains.filter(d=>d.id!==id);save();domainsModal();render()});break;
    case'closeModal':closeModal();break;
    case'tmStart':case'tmPause':case'tmResume':case'tmStop':tmAct(a);break;
    case'tmDiscard':ask(t('tm.confirmDiscard'),()=>tmAct('tmDiscard'));break;
    case'askYes':{const f=askCb;askCb=null;$('#confirm').innerHTML='';if(f)f();break}
    case'askNo':askCb=null;$('#confirm').innerHTML='';break;
    case'cat':{
      const w=el;w.classList.remove('bounce');void w.offsetWidth;w.classList.add('bounce');
      const m=mood(),msg=m==='away'?t('away.homeSay',{name:S.pet.name}):pick(t('say.'+m).split('|'));
      document.querySelectorAll('.bubble').forEach(b=>b.textContent=msg);break}
    case'feed':{
      tick();const f=FOODS.find(x=>x.id===id),p=S.pet;
      if(p.away)return toast(t('awayNoFeed'));
      if(p.fullness>=95)return toast(t('full'));
      if(p.coins<f.cost)return toast(t('nocoin'));
      p.coins-=f.cost;p.fullness=Math.min(100,p.fullness+f.gain);p.grace=null;p.lastTick=Date.now();S.stats.fed++;
      toast(t('fed'));burst(['💗','🐟']);after();break}
    case'buyDecor':{
      const d=DECOR.find(x=>x.id===id),p=S.pet;
      if(level(p.xp)<d.lvl)break;
      if(p.coins<d.cost)return toast(t('nocoin'));
      p.coins-=d.cost;p.owned.push(id);p.equipped.push(id);after();break}
    case'equip':{const p=S.pet;p.equipped=p.equipped.includes(id)?p.equipped.filter(x=>x!==id):[...p.equipped,id];save();render();break}
    case'redeem':{
      const r=S.rewards.find(x=>x.id===id);if(!r)break;
      if(S.pet.coins<r.cost)return toast(t('nocoin'));
      S.pet.coins-=r.cost;S.claims.unshift({name:r.name,cost:r.cost,ts:Date.now()});S.claims=S.claims.slice(0,30);
      toast(t('rw.done',{x:r.name}));burst(['🎁','✨']);save();render();break}
    case'delReward':S.rewards=S.rewards.filter(x=>x.id!==id);save();render();break;
    case'rescue':{
      const p=S.pet;if(!p.away)break;
      if(p.awayTasks<RESCUE_TASKS||p.coins<RESCUE_COST)return toast(t('away.need'));
      p.coins-=RESCUE_COST;p.away=false;p.grace=null;p.fullness=30;p.lastTick=Date.now();p.awayTasks=0;S.stats.rescued++;
      toast(t('away.back',{name:p.name}));burst(['🐱','💗','✨']);after();break}
    case'export':{
      const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');
      l.href=u;l.download='life-planner-'+todayStr().replace(/-/g,'')+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);break}
    case'importPick':$('#imp').click();break;
    case'sample':{const go=()=>{loadSample();ui.view='home';after()};if(!S.goals.length)go();else ask(t('confirmSample'),go);break}
    case'clear':ask(t('confirmClear'),()=>{const st=S.settings;S=defaultState();S.settings=st;ui.open={};save();render()});break;
  }
});
function handleForm(f){
  const k=f.dataset.form;if(!k)return;
  const d=Object.fromEntries(new FormData(f)),id=f.dataset.id;
  switch(k){
    case'addTask':{const title=(d.title||'').trim();if(!title)break;S.tasks.push({id:uid(),goalId:id,title,due:d.due||'',done:false,doneDate:null,rewarded:false,created:Date.now()});ui.open[id]=true;after();break}
    case'valueSet':{
      const g=S.goals.find(x=>x.id===id);if(!g)break;
      const nv=+d.v;if(!isFinite(nv))break;
      const inc=nv>g.current;g.current=nv;
      if(inc){const td=todayStr();if(S.stats.valDay!==td)S.stats.valDay=td,S.stats.valCnt=0;if(S.stats.valCnt<5){S.stats.valCnt++;award(5,3);toast(t('valUp'))}}
      checkGoalDone(id);after();break}
    case'goalForm':{
      const title=(d.title||'').trim();
      if(!title){toast(t('g.needTitle'));break}
      if(d.mode==='value'&&!(+d.target>0)){toast(t('g.needTarget'));break}
      if(d.mode==='manual'&&!(+d.manual>=0&&+d.manual<=100)){toast(t('g.manualMax'));break}
      const base={title,domainId:d.domainId,horizon:d.horizon,due:d.due||'',mode:d.mode,note:(d.note||'').trim(),
        target:+d.target||0,current:+d.current||0,unit:(d.unit||'').trim(),manual:Math.max(0,Math.min(100,+d.manual||0))};
      if(id){Object.assign(S.goals.find(x=>x.id===id),base);checkGoalDone(id)}
      else{const g={id:uid(),created:Date.now(),rewarded:false,...base};S.goals.push(g);g.rewarded=prog(g)>=100&&g.mode!=='tasks';ui.open[g.id]=true}
      closeModal();after();break}
    case'dayForm':{
      const date=f.dataset.date,old=(S.logs[date]||{}).min||0,nm=Math.max(0,Math.min(1440,Math.round(+d.min||0)));
      S.logs[date]={...(S.logs[date]||{}),min:nm,note:(d.note||'').trim()};
      if(date===todayStr()&&nm>old){const delta=nm-old;award(Math.floor(delta/10),Math.floor(delta/15))}
      closeModal();after();break}
    case'domainSave':{
      const dm=S.domains.find(x=>x.id===id);if(!dm)break;
      const nm=(d.name||'').trim();dm.icon=d.icon||dm.icon;dm.color=d.color||dm.color;
      if(dm.key&&nm===t('dom.'+dm.key))delete dm.name;else dm.name=nm;
      save();toast(t('saved'));render();break}
    case'domainNew':{S.domains.push({id:uid(),name:(d.name||'').trim(),icon:d.icon||'⭐',color:d.color||'#e48a45'});save();domainsModal();render();break}
    case'rewardNew':{const name=(d.name||'').trim();if(!name)break;S.rewards.push({id:uid(),name,cost:Math.max(1,Math.round(+d.cost||1)),icon:d.icon||'🎁'});save();render();break}
    case'petName':{S.pet.name=(d.n||'').trim()||S.pet.name;save();toast(t('saved'));render();break}
  }
}
document.addEventListener('submit',e=>{if(e.target.dataset&&e.target.dataset.form){e.preventDefault();handleForm(e.target)}});
document.addEventListener('change',e=>{
  const el=e.target;if(!el.dataset)return;
  if(el.dataset.act==='modeSel'){const m=el.value;$('#fVal').classList.toggle('hide',m!=='value');$('#fMan').classList.toggle('hide',m!=='manual');const h=$('#modeHint');if(h)h.textContent=t('g.hint.'+m)}
  else if(el.dataset.change==='manual'){const g=S.goals.find(x=>x.id===el.dataset.id);if(g){g.manual=+el.value;checkGoalDone(g.id);after()}}
  else if(el.dataset.change==='tmSubj'){
    const T=S.timer,nv=el.value;
    if(T.state==='idle'){T.subj=nv;save();render()}
    else{const was=T.state,ms=tmElapsed(),old=T.subj;S.timer={state:was==='run'?'run':'idle',since:Date.now(),acc:0,subj:nv};commitStudy(ms,old);after()}
  }
  else if(el.dataset.change==='tmWake'){S.settings.keepAwake=el.checked;save();syncWake()}
  else if(el.dataset.change==='import'){
    const file=el.files&&el.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const o=JSON.parse(r.result);
        if(!o||!Array.isArray(o.goals)||!Array.isArray(o.tasks)||!Array.isArray(o.domains))throw 0;
        ask(t('confirmImport'),()=>{S=migrate(o);ui.open={};save();render();toast(t('imported'))});
      }catch(err){toast(t('importErr'))}
    };
    r.readAsText(file);el.value='';
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#confirm').innerHTML){askCb=null;$('#confirm').innerHTML=''}else closeModal();return}
  if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){
    const el=e.target;
    if(el&&el.tagName==='INPUT'&&el.type!=='button'&&el.form&&el.form.dataset.form){e.preventDefault();handleForm(el.form)}
  }
});
document.addEventListener('visibilitychange',()=>{syncWake();if(!document.hidden)refresh()});
function refresh(){
  tick();save();
  const a=document.activeElement;
  if(!$('#modal').innerHTML&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render();
}
setInterval(refresh,60000);

applyTheme();render();checkAch();save();
</script>
